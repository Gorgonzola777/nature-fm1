# NATURE: a test build on every push to main (the package is the run's "packages" artifact, identity FM-1_628300).
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: git submodule update --init --recursive --depth 1 && python3 -m pip install fonttools && ./build.sh
      packages: build/*.fwsc
